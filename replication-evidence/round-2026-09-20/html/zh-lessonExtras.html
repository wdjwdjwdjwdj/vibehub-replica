<div class="lesson-extras"><section class="lesson-practice" aria-labelledby="lesson-practice-title"><div class="lesson-practice-heading"><span class="lesson-practice-kicker">选择题</span><span class="lesson-practice-hint">选择一个你认为最合适的答案</span></div><h2 id="lesson-practice-title">文章页的大标题只是放大的普通文字，“查看原文”也是可点击的普通容器。应该怎样修改？</h2><div class="lesson-practice-options"><label class="lesson-practice-option"><input type="radio" name="lesson-practice-html"><span class="lesson-practice-marker" aria-hidden="true">A</span><span class="lesson-practice-label">把标题和原文入口做进一张图片，再给整张图绑定点击</span></label><label class="lesson-practice-option"><input type="radio" name="lesson-practice-html"><span class="lesson-practice-marker" aria-hidden="true">B</span><span class="lesson-practice-label">用合适的 HTML 标题和链接元素表达结构与跳转</span></label><label class="lesson-practice-option"><input type="radio" name="lesson-practice-html"><span class="lesson-practice-marker" aria-hidden="true">C</span><span class="lesson-practice-label">保留现有容器，只继续加大字号并换成更醒目的颜色</span></label></div></section><section class="lesson-agent-prompt" aria-labelledby="lesson-agent-title"><h2 id="lesson-agent-title">你可以这样告诉 AI Agent</h2><blockquote><span class="lesson-agent-quote" aria-hidden="true">“</span><p>请先检查这篇文章的 HTML 结构：页面主标题使用正确的标题元素，“查看原文”使用真实链接，普通操作使用按钮。保留现有视觉样式，并用键盘确认链接和按钮都能正常访问。</p></blockquote></section></div>
